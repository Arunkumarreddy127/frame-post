server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: framepost-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/framepost}
      database: ${MONGODB_DATABASE:framepost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

framepost:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    session-hours: ${AUTH_SESSION_HOURS:24}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:replace-me}
      access-key-id: ${R2_ACCESS_KEY_ID:replace-me}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:replace-me}
      bucket-name: ${R2_BUCKET_NAME:framepost-assets}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    allowed-models: ${OPENAI_ALLOWED_MODELS:gpt-6-luna,gpt-6.1-sol,gpt-6-astra}
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:120}
  image:
    allowed-models: ${OPENAI_IMAGE_ALLOWED_MODELS:gpt-image-2.5-sunburst,gpt-image-2.5-flare}
    request-timeout-seconds: ${OPENAI_IMAGE_REQUEST_TIMEOUT_SECONDS:300}
  runninghub:
    api-key: ${RUNNINGHUB_API_KEY:}
    base-url: ${RUNNINGHUB_BASE_URL:https://www.runninghub.ai}
    request-timeout-seconds: ${RUNNINGHUB_REQUEST_TIMEOUT_SECONDS:60}
    poll-interval-seconds: ${RUNNINGHUB_POLL_INTERVAL_SECONDS:5}
    max-wait-seconds: ${RUNNINGHUB_MAX_WAIT_SECONDS:1800}
    webhook-base-url: ${RUNNINGHUB_WEBHOOK_BASE_URL:}
    webhook-secret: ${RUNNINGHUB_WEBHOOK_SECRET:}
